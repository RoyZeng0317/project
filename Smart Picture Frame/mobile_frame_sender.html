<!DOCTYPE html>
<!--
手機端：上傳照片給智慧相框，不挑瀏覽器、不用裝 App、不用 Web Bluetooth。
可一次選多張照片，逐張 POST 到電腦端 server.py 的 /upload，存進 photos/ 資料夾；
電腦端 components/GUI.py 的「推送到相框」如果正在跑，下一輪輪播就會自動顯示上傳的新照片，
沒開著的話手動去 GUI.py 按一下「推送到相框」即可。
(原本想用 Web Bluetooth 讓手機直接連 ESP32，但 Web Bluetooth 只有 Chrome 支援，
三星瀏覽器等其他瀏覽器完全沒有這支 API，所以改成「手機上傳 -> 電腦轉送」，任何瀏覽器都能用)
註解不可刪除
-->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartFrame 手機傳圖</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; padding: 16px; }
  button { font-size: 16px; padding: 10px 16px; margin: 6px 0; width: 100%; border: none; border-radius: 6px; background: #333; color: #fff; }
  button:disabled { opacity: 0.4; }
  #status { margin: 8px 0; color: #8cf; white-space: pre-wrap; }
  #previewList { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #previewList img { width: 72px; height: 72px; object-fit: cover; border: 1px solid #444; border-radius: 4px; }
</style>
</head>
<body>
  <h2>智慧相框 - 手機傳圖</h2>
  <input type="file" id="fileInput" accept="image/*" multiple>
  <div id="previewList"></div>
  <button id="sendBtn" disabled>📤 上傳到相框</button>
  <div id="status"></div>

<script>
const fileInput = document.getElementById('fileInput');
const previewList = document.getElementById('previewList');
const sendBtn = document.getElementById('sendBtn');
const statusEl = document.getElementById('status');

fileInput.addEventListener('change', () => {
  const files = fileInput.files;
  sendBtn.disabled = !files.length;
  previewList.innerHTML = '';
  for (const file of files) {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    previewList.appendChild(img);
  }
});

sendBtn.addEventListener('click', async () => {
  const files = [...fileInput.files];
  if (!files.length) return;
  sendBtn.disabled = true;
  let ok = 0;
  for (let i = 0; i < files.length; i++) {
    statusEl.textContent = `上傳中 (${i + 1}/${files.length})：${files[i].name}`;
    try {
      const res = await fetch('/upload', {
        method: 'POST',
        headers: { 'X-Filename': encodeURIComponent(files[i].name) },
        body: files[i],
      });
      if (res.ok) ok++;
    } catch (e) {
      // 單張失敗不中斷，繼續傳剩下的，最後統一報數量
    }
  }
  statusEl.textContent = `完成：${ok}/${files.length} 張上傳成功\n\n提醒：電腦那邊「推送到相框」要開著，下一輪就會自動顯示`;
  sendBtn.disabled = false;
});
</script>
</body>
</html>
